name: mssql-tools-docker-image-micro-servico-producao 

on:
  push:
    branches: [ main, "develop" ]

jobs:

  build:

    name: Build mssql-tools and scripts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set SECRET_TEST_SERVER_NAME
      uses: thiagodnf/string-replacer@v1.0.2
      with:
        find: "{{ secrets.TEST_SERVER_NAME }}"
        replace: "${{ secrets.TEST_SERVER_NAME }}"
        include: |
          ./Src/Scripts/init-database.sh 

    - name: Set SECRET_SA_USER
      uses: thiagodnf/string-replacer@v1.0.2
      with:
        find: "{{ secrets.SA_USER }}"
        replace: "${{ secrets.SA_USER }}"
        include: |
          ./Src/Scripts/init-database.sh           

    - name: Set SECRET_SA_PASSWORD
      uses: thiagodnf/string-replacer@v1.0.2
      with:
        find: "{{ secrets.SA_PASSWORD }}"
        replace: "${{ secrets.SA_PASSWORD }}"
        include: |
          ./Src/Scripts/init-database.sh      
          
    - name: Docker Login
      uses: docker/login-action@v3.3.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
              
    - name: Build and push Docker images
      uses: docker/build-push-action@v6.7.0
      with:
        context: ./Src
        file: ./Src/Docker/micro-servico-cadastro/Dockerfile
        #fixo, pois, sempre que trocar as secrets necessario alterar o nome da imagem a ser gerada.
        tags: ${{ secrets.DOCKER_USERNAME }}/fiap-pos-techchallenge-mssql-tools-docker-image-micro-servico-producao-gurpo-71-scripts-database:fase4-test 
        push: true        
          
